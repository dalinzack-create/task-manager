<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appBg: '#0f141f',
                        cardBg: '#151c2a',
                        cardBorder: '#2a3441',
                        primaryBlue: '#1c1c73',
                        primaryBlueHover: '#2a2a90',
                        checkIcon: '#3030b8'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        /* Custom scrollbar for task list */
        .task-container::-webkit-scrollbar { width: 6px; }
        .task-container::-webkit-scrollbar-track { background: transparent; }
        .task-container::-webkit-scrollbar-thumb { background-color: #2a3441; border-radius: 20px; }
    </style>
</head>
<body class="bg-appBg h-screen flex items-center justify-center p-4">

    <div class="bg-cardBg border border-cardBorder rounded-3xl w-full max-w-md p-8 relative shadow-2xl">
        
        <!-- Settings/Gear Icon -->
        <button class="absolute top-6 right-6 w-8 h-8 flex items-center justify-center rounded-full bg-slate-800 text-slate-400 hover:text-white transition-colors">
            <i class="fas fa-cog"></i>
        </button>

        <!-- Header Area -->
        <div class="flex flex-col items-center mt-4 mb-8">
            <div class="w-12 h-12 bg-primaryBlue rounded-xl flex items-center justify-center mb-4 shadow-lg shadow-primaryBlue/20">
                <i class="fas fa-check-double text-white text-xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Task Manager</h1>
            <p class="text-slate-400 text-sm">Organize your day, achieve your goals.</p>
        </div>

        <!-- Input Area -->
        <div class="flex gap-3 mb-8">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Buy Milk" 
                class="flex-1 bg-transparent border border-cardBorder rounded-xl px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-slate-500 transition-colors"
                autocomplete="off"
            >
            <button 
                id="addTaskBtn" 
                class="bg-primaryBlue hover:bg-primaryBlueHover text-white w-12 rounded-xl flex items-center justify-center transition-colors shadow-lg"
            >
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <!-- Empty State (Hidden by default) -->
        <div id="emptyState" class="flex flex-col items-center justify-center py-6 hidden">
            <div class="w-16 h-16 rounded-full bg-slate-800/50 flex items-center justify-center mb-4">
                <i class="fas fa-wind text-2xl text-slate-500"></i>
            </div>
            <p class="text-slate-400 text-sm font-medium mb-1">Your list is a blank canvas.</p>
            <p class="text-slate-500 text-xs">Add a task above to get started.</p>
        </div>

        <!-- Task List -->
        <div id="taskList" class="task-container max-h-60 overflow-y-auto space-y-3 pr-1">
            <!-- Tasks injected via JS -->
        </div>

    </div>

    <script>
        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');

        // State Management
        let tasks = JSON.parse(localStorage.getItem('myTasks')) || [];

        // Save to browser LocalStorage
        function saveTasks() {
            localStorage.setItem('myTasks', JSON.stringify(tasks));
        }

        // Render UI
        function renderTasks() {
            taskList.innerHTML = '';
            
            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                tasks.forEach((task, index) => {
                    const taskDiv = document.createElement('div');
                    taskDiv.className = `flex items-center justify-between p-4 rounded-xl border border-cardBorder bg-cardBg/50 hover:bg-slate-800/50 transition-colors group`;

                    const leftCol = document.createElement('div');
                    leftCol.className = 'flex items-center gap-3 overflow-hidden';

                    const checkbox = document.createElement('div');
                    checkbox.className = `w-5 h-5 rounded border flex items-center justify-center cursor-pointer transition-colors shrink-0 ${task.completed ? 'bg-primaryBlue border-primaryBlue' : 'border-slate-500'}`;
                    checkbox.innerHTML = task.completed ? '<i class="fas fa-check text-white text-xs"></i>' : '';
                    checkbox.onclick = () => toggleTask(index);

                    const text = document.createElement('span');
                    text.textContent = task.text;
                    text.className = `truncate text-sm ${task.completed ? 'text-slate-500 line-through' : 'text-slate-200'}`;

                    leftCol.appendChild(checkbox);
                    leftCol.appendChild(text);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all shrink-0';
                    deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                    deleteBtn.onclick = () => deleteTask(index);

                    taskDiv.appendChild(leftCol);
                    taskDiv.appendChild(deleteBtn);
                    taskList.appendChild(taskDiv);
                });
            }
        }

        // Actions
        function addTask() {
            const text = taskInput.value.trim();
            if (text.length > 0) {
                tasks.push({ text, completed: false });
                taskInput.value = '';
                saveTasks();
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        // Event Listeners
        addTaskBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Initial Load
        renderTasks();
    </script>
</body>
</html>
